name: build-evolution-pairing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código da correção (commit fixo que foi revisado)
        uses: actions/checkout@v4
        with:
          repository: ErgoCodes/evolution-api
          ref: d0198733da3cb133bd0c64d24fc4d1e7720696b1

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/evolution-api-pairing" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:2.3.7-rc14
